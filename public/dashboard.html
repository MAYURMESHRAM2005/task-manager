<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - TaskFlow</title>
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskFlow">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <!-- Quick Actions -->
        <div class="quick-actions">
          <button class="quick-action-btn" onclick="window.location.href='/tasks'">✅ My Tasks</button>
          <button class="quick-action-btn" onclick="window.location.href='/kanban'">📋 Kanban Board</button>
          <button class="quick-action-btn" onclick="window.location.href='/calendar'">📅 Calendar</button>
          <button class="quick-action-btn" onclick="window.location.href='/analytics'">📈 Analytics</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-icon blue">📋</div><div class="stat-value" id="totalTasks">0</div><div class="stat-label">Total Tasks</div></div>
          <div class="stat-card"><div class="stat-icon green">✅</div><div class="stat-value" id="completedTasks">0</div><div class="stat-label">Completed</div></div>
          <div class="stat-card"><div class="stat-icon yellow">⏳</div><div class="stat-value" id="pendingTasks">0</div><div class="stat-label">Pending</div></div>
          <div class="stat-card"><div class="stat-icon purple">🔄</div><div class="stat-value" id="inProgressTasks">0</div><div class="stat-label">In Progress</div></div>
          <div class="stat-card"><div class="stat-icon red">⚠️</div><div class="stat-value" id="overdueTasks">0</div><div class="stat-label">Overdue</div></div>
        </div>

        <!-- Productivity + Upcoming -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
          <div class="card">
            <h3 style="font-size:0.95rem;margin-bottom:12px">🎯 Productivity</h3>
            <div style="display:flex;align-items:center;gap:20px">
              <div id="prodScore"></div>
              <div>
                <div style="font-size:0.85rem;color:var(--text-secondary)">Tasks completed today: <strong id="todayCount">0</strong></div>
                <div style="font-size:0.85rem;color:var(--text-secondary)">Due this week: <strong id="weekCount">0</strong></div>
              </div>
            </div>
          </div>
          <div class="card">
            <h3 style="font-size:0.95rem;margin-bottom:12px">📅 Upcoming</h3>
            <div id="upcomingBrief" style="font-size:0.85rem;color:var(--text-secondary)"></div>
          </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
          <div class="chart-container"><h3>Tasks by Status</h3><canvas id="statusChart"></canvas></div>
          <div class="chart-container"><h3>Tasks by Priority</h3><canvas id="priorityChart"></canvas></div>
          <div class="chart-container"><h3>Weekly Completed Tasks</h3><canvas id="weeklyChart"></canvas></div>
          <div class="chart-container"><h3>Completion Rate</h3><canvas id="completionChart"></canvas></div>
        </div>

        <!-- Recent Activity -->
        <div class="card mt-20">
          <h3 style="font-size:0.95rem;margin-bottom:12px">🕐 Recent Activity</h3>
          <ul class="activity-feed" id="activityFeed"></ul>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-container"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    if (!requireAuth()) throw new Error('Not authenticated');
    initTheme();
    initSocket();
    document.getElementById('sidebar').innerHTML = renderSidebar('dashboard');
    document.getElementById('topbar').innerHTML = renderTopbar('dashboard');
    ensureSidebarOverlay();
    updateNotifCount();

    let statusChart, priorityChart, weeklyChart, completionChart;
    let dashboardStats = null;

    function destroyCharts() {
      [statusChart, priorityChart, weeklyChart, completionChart].forEach(c => { if (c) c.destroy(); });
      statusChart = priorityChart = weeklyChart = completionChart = null;
    }

    function renderCharts(s) {
      destroyCharts();
      const t = getChartTheme();
      const scales = getChartScales(t);

      statusChart = new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
          labels: ['TODO', 'In Progress', 'Review', 'Completed', 'Cancelled'],
          datasets: [{ data: [s.statusBreakdown.TODO || 0, s.statusBreakdown.IN_PROGRESS || 0, s.statusBreakdown.REVIEW || 0, s.statusBreakdown.COMPLETED || 0, s.statusBreakdown.CANCELLED || 0], backgroundColor: ['#3b82f6', '#f59e0b', '#8b5cf6', '#22c55e', '#ef4444'] }],
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: t.legendColor, usePointStyle: true, padding: 16 } }, tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipTitle, bodyColor: t.tooltipBody, borderColor: t.tooltipBorder, borderWidth: 1 } } },
      });

      priorityChart = new Chart(document.getElementById('priorityChart'), {
        type: 'bar',
        data: {
          labels: ['Low', 'Medium', 'High', 'Urgent'],
          datasets: [{ label: 'Tasks', data: [s.priorityBreakdown.LOW || 0, s.priorityBreakdown.MEDIUM || 0, s.priorityBreakdown.HIGH || 0, s.priorityBreakdown.URGENT || 0], backgroundColor: ['#22c55e', '#f59e0b', '#f97316', '#ef4444'] }],
        },
        options: { responsive: true, plugins: { legend: { display: false }, tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipTitle, bodyColor: t.tooltipBody, borderColor: t.tooltipBorder, borderWidth: 1 } }, scales: scales },
      });

      const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const weeklyData = new Array(7).fill(0);
      s.weeklyCompleted.forEach((w) => { weeklyData[w._id - 1] = w.count; });
      weeklyChart = new Chart(document.getElementById('weeklyChart'), {
        type: 'line',
        data: {
          labels: dayLabels,
          datasets: [{ label: 'Completed', data: weeklyData, borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,0.1)', fill: true, tension: 0.4, pointBackgroundColor: '#6366f1', pointBorderColor: '#6366f1' }],
        },
        options: { responsive: true, plugins: { legend: { display: false }, tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipTitle, bodyColor: t.tooltipBody, borderColor: t.tooltipBorder, borderWidth: 1 } }, scales: scales },
      });

      completionChart = new Chart(document.getElementById('completionChart'), {
        type: 'doughnut',
        data: {
          labels: ['Completed', 'Remaining'],
          datasets: [{ data: [s.completionPercentage, 100 - s.completionPercentage], backgroundColor: ['#22c55e', t.remainingColor] }],
        },
        options: { responsive: true, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { color: t.legendColor, usePointStyle: true, padding: 16 } }, tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipTitle, bodyColor: t.tooltipBody, borderColor: t.tooltipBorder, borderWidth: 1 } } },
      });
    }

    async function loadDashboard() {
      try {
        const result = await api.getDashboardStats();
        const s = result.data.stats;
        dashboardStats = s;

        document.getElementById('totalTasks').textContent = s.totalTasks;
        document.getElementById('completedTasks').textContent = s.completedTasks;
        document.getElementById('pendingTasks').textContent = s.pendingTasks;
        document.getElementById('inProgressTasks').textContent = s.inProgressTasks;
        document.getElementById('overdueTasks').textContent = s.overdueTasks;

        // Productivity
        document.getElementById('prodScore').innerHTML = scoreRing(s.productivityScore);
        document.getElementById('todayCount').textContent = s.todayTasks;
        document.getElementById('weekCount').textContent = s.upcomingTasks;

        // Upcoming brief
        document.getElementById('upcomingBrief').innerHTML = `
          <div>${s.overdueTasks} overdue · ${s.todayTasks} due today · ${s.upcomingTasks} due this week</div>
        `;

        // Recent Activity
        const feed = document.getElementById('activityFeed');
        if (s.recentActivity && s.recentActivity.length > 0) {
          feed.innerHTML = s.recentActivity.map(t => {
            const color = t.status === 'COMPLETED' ? 'var(--success)' : t.status === 'IN_PROGRESS' ? 'var(--warning)' : 'var(--info)';
            return `
              <li class="activity-item">
                <div class="activity-dot" style="background:${color}"></div>
                <div style="flex:1">
                  <div style="font-weight:500">${escapeHtml(t.title)}</div>
                  <div style="font-size:0.78rem;color:var(--text-secondary)">${statusBadge(t.status)} · ${priorityBadge(t.priority)} · ${timeAgo(t.updatedAt)}</div>
                </div>
              </li>
            `;
          }).join('');
        } else {
          feed.innerHTML = '<li class="activity-item" style="justify-content:center;color:var(--text-secondary)">No recent activity</li>';
        }

        // Charts
        renderCharts(s);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // Re-render charts on theme switch
    window.addEventListener('themechange', () => {
      if (dashboardStats) renderCharts(dashboardStats);
    });

    // Real-time notification toasts
    const s = getSocket();
    if (s) {
      s.on('notification', (data) => {
        if (data && data.message) {
          showToast(data.message, 'info');
        }
      });
    }

    loadDashboard();
  </script>
</body>
</html>
