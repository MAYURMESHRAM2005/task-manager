<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="flex-between mb-20">
          <div class="filter-bar">
            <select class="form-control" id="statusFilter" onchange="loadTasks(1)">
              <option value="">All Status</option>
              <option value="TODO">TODO</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="COMPLETED">Completed</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
            <select class="form-control" id="priorityFilter" onchange="loadTasks(1)">
              <option value="">All Priority</option>
              <option value="LOW">Low</option>
              <option value="MEDIUM">Medium</option>
              <option value="HIGH">High</option>
              <option value="URGENT">Urgent</option>
            </select>
            <input type="text" class="form-control" id="searchInput" placeholder="Search tasks..." onkeyup="debounceSearch()">
          </div>
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Task</button>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr><th>Title</th><th>Status</th><th>Priority</th><th>Assigned To</th><th>Due Date</th><th>Actions</th></tr>
              </thead>
              <tbody id="taskTableBody">
                <tr><td colspan="6" class="loading-overlay">Loading tasks...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create/Edit Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="taskModalTitle">New Task</h3>
        <button class="modal-close" onclick="hideModal('taskModal')">&times;</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="editTaskId" value="">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="taskTitle" class="form-control" placeholder="Task title" required minlength="2" maxlength="200">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="taskDescription" class="form-control" placeholder="Task description" rows="3" maxlength="2000"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select id="taskStatus" class="form-control">
              <option value="TODO">TODO</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="COMPLETED">Completed</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select id="taskPriority" class="form-control">
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
              <option value="HIGH">High</option>
              <option value="URGENT">Urgent</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Due Date</label>
            <input type="date" id="taskDueDate" class="form-control">
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="taskCategory" class="form-control" placeholder="e.g. Frontend" maxlength="50">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>⏰ Reminder</label>
            <input type="datetime-local" id="taskReminderAt" class="form-control">
          </div>
          <div class="form-group"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Project</label>
            <select id="taskProject" class="form-control">
              <option value="">No Project</option>
            </select>
          </div>
          <div class="form-group">
            <label>Assign To</label>
            <select id="taskAssignedTo" class="form-control">
              <option value="">Unassigned</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="hideModal('taskModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="taskSubmitBtn">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Delete Task</h3>
        <button class="modal-close" onclick="hideModal('deleteModal')">&times;</button>
      </div>
      <p>Are you sure you want to delete this task? This action cannot be undone.</p>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="hideModal('deleteModal')">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');
    initTheme();
    initSocket();
    document.getElementById('sidebar').innerHTML = renderSidebar('tasks');
    document.getElementById('topbar').innerHTML = renderTopbar('tasks');
    ensureSidebarOverlay();
    updateNotifCount();

    let currentPage = 1;
    let searchTimeout;
    let usersList = [];
    let projectsList = [];

    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => loadTasks(1), 400);
    }

    // Load users for dropdown
    async function loadUsersForDropdown() {
      try {
        const result = await api.getUsers({ limit: 100 });
        usersList = result.data || [];
        const select = document.getElementById('taskAssignedTo');
        select.innerHTML = '<option value="">Unassigned</option>';
        usersList.forEach(u => {
          select.innerHTML += `<option value="${u._id}">${escapeHtml(u.name)} (${escapeHtml(u.email)})</option>`;
        });
      } catch { /* ignore */ }
    }

    // Load projects for dropdown
    async function loadProjectsForDropdown() {
      try {
        const result = await api.getProjects({ limit: 100 });
        projectsList = result.data || [];
        const select = document.getElementById('taskProject');
        select.innerHTML = '<option value="">No Project</option>';
        projectsList.forEach(p => {
          select.innerHTML += `<option value="${p._id}">${escapeHtml(p.name)}</option>`;
        });
      } catch { /* ignore */ }
    }

    async function loadTasks(page = 1) {
      currentPage = page;
      const params = { page, limit: 10 };
      const status = document.getElementById('statusFilter').value;
      const priority = document.getElementById('priorityFilter').value;
      const search = document.getElementById('searchInput').value.trim();
      if (status) params.status = status;
      if (priority) params.priority = priority;
      if (search) params.search = search;

      const tbody = document.getElementById('taskTableBody');
      tbody.innerHTML = '<tr><td colspan="6" class="loading-overlay"><span class="loading-spinner"></span></td></tr>';

      try {
        const result = await api.getTasks(params);
        const tasks = result.data;
        const pag = result.pagination;

        if (tasks.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📭</div><h3>No tasks found</h3><p>Create your first task to get started</p></div></td></tr>';
        } else {
          tbody.innerHTML = tasks.map(t => `
            <tr>
              <td data-label="Title"><strong>${escapeHtml(t.title)}</strong>${t.description ? '<br><small style="color:var(--text-secondary)">' + escapeHtml(t.description.substring(0, 80)) + '</small>' : ''}</td>
              <td data-label="Status">${statusBadge(t.status)}</td>
              <td data-label="Priority">${priorityBadge(t.priority)}</td>
              <td data-label="Assigned To">${t.assignedTo ? escapeHtml(t.assignedTo.name) : '<span style="color:var(--text-secondary)">Unassigned</span>'}</td>
              <td data-label="Due Date">${formatDate(t.dueDate)}${t.reminderAt && !t.reminderNotified ? '<br><small style="color:var(--primary)">⏰ ' + formatDateTime(t.reminderAt) + '</small>' : ''}</td>
              <td data-label="Actions">
                <div class="flex gap-10">
                  <button class="btn btn-sm btn-outline" onclick="openEditModal('${t._id}')">Edit</button>
                  <button class="btn btn-sm btn-danger" onclick="openDeleteModal('${t._id}')">Del</button>
                </div>
              </td>
            </tr>
          `).join('');
        }

        renderPagination(pag);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><h3>Error loading tasks</h3><p>${escapeHtml(err.message)}</p></div></td></tr>`;
      }
    }

    function renderPagination(pag) {
      const container = document.getElementById('pagination');
      if (pag.totalPages <= 1) { container.innerHTML = ''; return; }
      let html = `<button ${pag.page <= 1 ? 'disabled' : ''} onclick="loadTasks(${pag.page - 1})">‹ Prev</button>`;
      for (let i = 1; i <= pag.totalPages; i++) {
        html += `<button class="${i === pag.page ? 'active' : ''}" onclick="loadTasks(${i})">${i}</button>`;
      }
      html += `<button ${pag.page >= pag.totalPages ? 'disabled' : ''} onclick="loadTasks(${pag.page + 1})">Next ›</button>`;
      container.innerHTML = html;
    }

    // ── Task Modal ──────────────────────────────────────────────────────
    function openCreateModal() {
      document.getElementById('taskModalTitle').textContent = 'New Task';
      document.getElementById('taskSubmitBtn').textContent = 'Create Task';
      document.getElementById('editTaskId').value = '';
      document.getElementById('taskForm').reset();
      document.getElementById('taskStatus').value = 'TODO';
      document.getElementById('taskPriority').value = 'MEDIUM';
      document.getElementById('taskAssignedTo').value = '';
      document.getElementById('taskProject').value = '';
      document.getElementById('taskReminderAt').value = '';
      showModal('taskModal');
    }

    async function openEditModal(id) {
      try {
        const result = await api.getTask(id);
        const t = result.data.task;
        document.getElementById('taskModalTitle').textContent = 'Edit Task';
        document.getElementById('taskSubmitBtn').textContent = 'Update Task';
        document.getElementById('editTaskId').value = t._id;
        document.getElementById('taskTitle').value = t.title;
        document.getElementById('taskDescription').value = t.description || '';
        document.getElementById('taskStatus').value = t.status;
        document.getElementById('taskPriority').value = t.priority;
        document.getElementById('taskDueDate').value = t.dueDate ? t.dueDate.split('T')[0] : '';
        document.getElementById('taskCategory').value = t.category || '';
        document.getElementById('taskAssignedTo').value = t.assignedTo?._id || '';
        document.getElementById('taskProject').value = t.project?._id || '';
        document.getElementById('taskReminderAt').value = t.reminderAt ? t.reminderAt.slice(0, 16) : '';
        showModal('taskModal');
      } catch (err) { showToast(err.message, 'error'); }
    }

    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('taskSubmitBtn');
      const editId = document.getElementById('editTaskId').value;
      btn.disabled = true;

      try {
        const data = {
          title: document.getElementById('taskTitle').value.trim(),
          description: document.getElementById('taskDescription').value.trim(),
          status: document.getElementById('taskStatus').value,
          priority: document.getElementById('taskPriority').value,
          dueDate: document.getElementById('taskDueDate').value || null,
          category: document.getElementById('taskCategory').value.trim() || null,
          assignedTo: document.getElementById('taskAssignedTo').value || null,
          project: document.getElementById('taskProject').value || null,
          reminderAt: document.getElementById('taskReminderAt').value || null,
        };

        if (editId) {
          await api.updateTask(editId, data);
          showToast('Task updated successfully', 'success');
        } else {
          await api.createTask(data);
          showToast('Task created successfully', 'success');
        }
        hideModal('taskModal');
        loadTasks(currentPage);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    // ── Delete ──────────────────────────────────────────────────────────
    let deleteTaskId;
    function openDeleteModal(id) { deleteTaskId = id; showModal('deleteModal'); }
    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      try {
        await api.deleteTask(deleteTaskId);
        showToast('Task deleted successfully', 'success');
        hideModal('deleteModal');
        loadTasks(currentPage);
      } catch (err) { showToast(err.message, 'error'); }
    });

    // Initialize dropdowns and load tasks
    Promise.all([loadUsersForDropdown(), loadProjectsForDropdown()]).then(() => loadTasks());
  </script>
</body>
</html>
