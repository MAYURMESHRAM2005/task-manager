<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams - TaskFlow</title>
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskFlow">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="flex-between mb-20">
          <h2 style="font-size:1rem;color:var(--text-secondary)" id="teamCount"></h2>
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Team</button>
        </div>
        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Team Name</th><th>Members</th><th>Created</th><th>Actions</th></tr></thead>
              <tbody id="teamTableBody">
                <tr><td colspan="4" class="loading-overlay"><span class="loading-spinner"></span></td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="teamModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="teamModalTitle">New Team</h3>
        <button class="modal-close" onclick="hideModal('teamModal')">&times;</button>
      </div>
      <form id="teamForm">
        <input type="hidden" id="editTeamId" value="">
        <div class="form-group">
          <label>Team Name *</label>
          <input type="text" id="teamName" class="form-control" required minlength="2">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="teamDesc" class="form-control" rows="3"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="hideModal('teamModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="teamSubmitBtn">Create Team</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    if (!requireAuth()) throw new Error('Not authenticated');
    initTheme();
    document.getElementById('sidebar').innerHTML = renderSidebar('teams');
    document.getElementById('topbar').innerHTML = renderTopbar('teams');
    ensureSidebarOverlay();
    updateNotifCount();

    let currentPage = 1;

    async function loadTeams(page = 1) {
      currentPage = page;
      const tbody = document.getElementById('teamTableBody');
      tbody.innerHTML = '<tr><td colspan="4" class="loading-overlay"><span class="loading-spinner"></span></td></tr>';

      try {
        const result = await api.getTeams({ page, limit: 10 });
        const teams = result.data;
        const pag = result.pagination;
        document.getElementById('teamCount').textContent = `${pag.total} team${pag.total !== 1 ? 's' : ''}`;

        if (teams.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><div class="empty-icon">👥</div><h3>No teams yet</h3><p>Create your first team</p></div></td></tr>';
        } else {
          tbody.innerHTML = teams.map(t => `
            <tr>
              <td data-label="Team"><strong>${escapeHtml(t.name)}</strong><br><small style="color:var(--text-secondary)">${escapeHtml(t.description || '')}</small></td>
              <td data-label="Members">${t.members?.length || 0} member${(t.members?.length || 0) !== 1 ? 's' : ''}</td>
              <td data-label="Created">${formatDate(t.createdAt)}</td>
              <td data-label="Actions">
                <div class="flex gap-10">
                  <button class="btn btn-sm btn-outline" onclick="openEditModal('${t._id}')">Edit</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteTeam('${t._id}')">Del</button>
                </div>
              </td>
            </tr>
          `).join('');
        }

        const container = document.getElementById('pagination');
        if (pag.totalPages <= 1) { container.innerHTML = ''; return; }
        let html = `<button ${pag.page<=1?'disabled':''} onclick="loadTeams(${pag.page-1})">‹ Prev</button>`;
        for (let i=1; i<=pag.totalPages; i++) { html += `<button class="${i===pag.page?'active':''}" onclick="loadTeams(${i})">${i}</button>`; }
        html += `<button ${pag.page>=pag.totalPages?'disabled':''} onclick="loadTeams(${pag.page+1})">Next ›</button>`;
        container.innerHTML = html;
      } catch (err) { tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><h3>Error</h3><p>${escapeHtml(err.message)}</p></div></td></tr>`; }
    }

    function openCreateModal() {
      document.getElementById('teamModalTitle').textContent = 'New Team';
      document.getElementById('teamSubmitBtn').textContent = 'Create Team';
      document.getElementById('editTeamId').value = '';
      document.getElementById('teamForm').reset();
      showModal('teamModal');
    }

    async function openEditModal(id) {
      try {
        const result = await api.getTeam(id);
        const t = result.data.team;
        document.getElementById('teamModalTitle').textContent = 'Edit Team';
        document.getElementById('teamSubmitBtn').textContent = 'Update Team';
        document.getElementById('editTeamId').value = t._id;
        document.getElementById('teamName').value = t.name;
        document.getElementById('teamDesc').value = t.description || '';
        showModal('teamModal');
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteTeam(id) {
      if (!confirm('Delete this team?')) return;
      try { await api.deleteTeam(id); showToast('Team deleted', 'success'); loadTeams(currentPage); }
      catch (err) { showToast(err.message, 'error'); }
    }

    document.getElementById('teamForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('teamSubmitBtn');
      const editId = document.getElementById('editTeamId').value;
      btn.disabled = true;
      try {
        const data = { name: document.getElementById('teamName').value.trim(), description: document.getElementById('teamDesc').value.trim() };
        if (editId) { await api.updateTeam(editId, data); showToast('Team updated', 'success'); }
        else { await api.createTeam(data); showToast('Team created', 'success'); }
        hideModal('teamModal');
        loadTeams(currentPage);
      } catch (err) { showToast(err.message, 'error'); }
      finally { btn.disabled = false; }
    });

    loadTeams();
  </script>
</body>
</html>
