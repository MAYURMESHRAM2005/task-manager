<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - TaskFlow</title>
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskFlow">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="flex-between mb-20">
          <div style="display:flex;align-items:center;gap:12px">
            <button class="btn btn-outline btn-sm" onclick="changeMonth(-1)">‹ Prev</button>
            <h2 id="monthLabel" style="font-size:1.1rem;min-width:180px;text-align:center"></h2>
            <button class="btn btn-outline btn-sm" onclick="changeMonth(1)">Next ›</button>
            <button class="btn btn-sm btn-outline" onclick="goToday()">Today</button>
          </div>
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Task</button>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Day Tasks Modal -->
  <div class="modal-overlay" id="dayTasksModal">
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <h3 class="modal-title" id="dayTasksTitle">Tasks</h3>
        <button class="modal-close" onclick="hideModal('dayTasksModal')">&times;</button>
      </div>
      <div id="dayTasksContent"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="hideModal('dayTasksModal')">Close</button>
        <button class="btn btn-primary" id="addTaskForDayBtn">+ Add Task</button>
      </div>
    </div>
  </div>

  <!-- Create Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">New Task</h3>
        <button class="modal-close" onclick="hideModal('taskModal')">&times;</button>
      </div>
      <form id="taskForm">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="taskTitle" class="form-control" placeholder="Task title" required minlength="2">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="taskDescription" class="form-control" rows="2"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Due Date *</label>
            <input type="date" id="taskDueDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select id="taskPriority" class="form-control">
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
              <option value="HIGH">High</option>
              <option value="URGENT">Urgent</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Project</label>
          <select id="taskProject" class="form-control"><option value="">No Project</option></select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="hideModal('taskModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal" style="max-width:650px">
      <div class="modal-header">
        <h3 class="modal-title" id="detailTitle">Task Details</h3>
        <button class="modal-close" onclick="hideModal('detailModal')">&times;</button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    if (!requireAuth()) throw new Error('Not authenticated');
    initTheme();
    initSocket();
    document.getElementById('sidebar').innerHTML = renderSidebar('calendar');
    document.getElementById('topbar').innerHTML = renderTopbar('calendar');
    ensureSidebarOverlay();
    updateNotifCount();

    let currentDate = new Date();
    let calendarTasks = [];
    let selectedDateStr = null;

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      loadCalendar();
    }

    function goToday() {
      currentDate = new Date();
      loadCalendar();
    }

    async function loadCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      document.getElementById('monthLabel').textContent =
        currentDate.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });

      // Get start/end range (include padding days)
      const startPad = firstDay.getDay();
      const startDate = new Date(firstDay);
      startDate.setDate(startDate.getDate() - startPad);
      const endPad = 6 - lastDay.getDay();
      const endDate = new Date(lastDay);
      endDate.setDate(endDate.getDate() + endPad);
      endDate.setHours(23, 59, 59);

      try {
        const result = await api.getCalendarData({
          dateFrom: startDate.toISOString(),
          dateTo: endDate.toISOString(),
        });
        calendarTasks = result.data || [];
        renderCalendar(year, month, startDate, endDate);
      } catch (err) {
        document.getElementById('calendarGrid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><h3>Error</h3><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    function renderCalendar(year, month, startDate, endDate) {
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      let html = days.map(d => `<div class="calendar-header-cell">${d}</div>`).join('');

      const current = new Date(startDate);
      while (current <= endDate) {
        const dateStr = current.toISOString().split('T')[0];
        const isToday = dateStr === todayStr;
        const isOtherMonth = current.getMonth() !== month;

        const dayTasks = calendarTasks.filter(t => {
          if (!t.dueDate) return false;
          return t.dueDate.split('T')[0] === dateStr;
        });

        html += `
          <div class="calendar-cell ${isToday ? 'today' : ''} ${isOtherMonth ? 'other-month' : ''}"
               onclick="showDayTasks('${dateStr}')">
            <div class="calendar-date">${current.getDate()}</div>
            ${dayTasks.slice(0, 3).map(t => `
              <div class="calendar-event ${t.status.toLowerCase().replace('_', '-')}" title="${escapeHtml(t.title)}">
                ${escapeHtml(t.title)}
              </div>
            `).join('')}
            ${dayTasks.length > 3 ? `<div style="font-size:0.68rem;color:var(--text-secondary)">+${dayTasks.length - 3} more</div>` : ''}
          </div>
        `;
        current.setDate(current.getDate() + 1);
      }

      document.getElementById('calendarGrid').innerHTML = html;
    }

    async function showDayTasks(dateStr) {
      selectedDateStr = dateStr;
      const date = new Date(dateStr + 'T00:00:00');
      const formattedDate = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      document.getElementById('dayTasksTitle').textContent = formattedDate;

      // Collect tasks due on this date
      const dueTasks = calendarTasks.filter(t => t.dueDate && t.dueDate.split('T')[0] === dateStr);

      // Also fetch tasks created on this date
      let createdTasks = [];
      try {
        const startOfDay = new Date(dateStr + 'T00:00:00.000Z');
        const endOfDay = new Date(dateStr + 'T23:59:59.999Z');
        const result = await api.getTasks({
          createdFrom: startOfDay.toISOString(),
          createdTo: endOfDay.toISOString(),
          limit: 50
        });
        createdTasks = (result.data?.tasks || []).filter(t => {
          // Exclude tasks already in due list
          return !dueTasks.find(d => d._id === t._id);
        });
      } catch { /* ignore */ }

      let html = '';

      if (dueTasks.length === 0 && createdTasks.length === 0) {
        html = `
          <div class="empty-state" style="padding:30px">
            <div class="empty-icon">📅</div>
            <h3>No tasks for this day</h3>
            <p>Create a new task or check other dates.</p>
          </div>
        `;
      } else {
        if (dueTasks.length > 0) {
          html += `<div style="margin-bottom:16px"><strong style="font-size:0.85rem;color:var(--text-secondary)">📌 Due on this day (${dueTasks.length})</strong></div>`;
          html += `<ul class="day-tasks-list">`;
          dueTasks.forEach(t => {
            html += renderDayTaskItem(t, 'due');
          });
          html += `</ul>`;
        }

        if (createdTasks.length > 0) {
          html += `<div style="margin-top:16px;margin-bottom:12px"><strong style="font-size:0.85rem;color:var(--text-secondary)">✨ Created on this day (${createdTasks.length})</strong></div>`;
          html += `<ul class="day-tasks-list">`;
          createdTasks.forEach(t => {
            html += renderDayTaskItem(t, 'created');
          });
          html += `</ul>`;
        }
      }

      document.getElementById('dayTasksContent').innerHTML = html;

      // Set up "Add Task" button for this day
      document.getElementById('addTaskForDayBtn').onclick = () => {
        hideModal('dayTasksModal');
        document.getElementById('taskDueDate').value = dateStr;
        showModal('taskModal');
      };

      showModal('dayTasksModal');
    }

    function renderDayTaskItem(task, type) {
      const statusMap = {
        'TODO': 'badge-todo',
        'IN_PROGRESS': 'badge-progress',
        'REVIEW': 'badge-progress',
        'COMPLETED': 'badge-completed',
        'CANCELLED': 'badge-cancelled'
      };
      const priorityMap = {
        'LOW': 'badge-low',
        'MEDIUM': 'badge-medium',
        'HIGH': 'badge-high',
        'URGENT': 'badge-urgent'
      };

      return `
        <li class="day-task-item" onclick="showTaskDetail('${task._id}')">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <span class="day-task-type ${type}">${type}</span>
              <span class="day-task-title">${escapeHtml(task.title)}</span>
            </div>
            <div class="day-task-meta">
              <span class="badge ${statusMap[task.status] || ''}">${task.status.replace('_', ' ')}</span>
              <span class="badge ${priorityMap[task.priority] || ''}">${task.priority}</span>
              ${task.project ? `<span style="color:var(--text-muted)">📁 ${escapeHtml(task.project.name || '')}</span>` : ''}
              ${task.assignedTo ? `<span style="color:var(--text-muted)">👤 ${escapeHtml(task.assignedTo.name || '')}</span>` : ''}
            </div>
          </div>
        </li>
      `;
    }

    async function showTaskDetail(taskId) {
      try {
        const result = await api.getTask(taskId);
        const t = result.data.task;

        document.getElementById('detailTitle').textContent = t.title;
        document.getElementById('detailContent').innerHTML = `
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
            ${statusBadge(t.status)} ${priorityBadge(t.priority)}
          </div>
          ${t.description ? `<p style="color:var(--text-secondary);margin-bottom:16px">${escapeHtml(t.description)}</p>` : ''}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;font-size:0.85rem">
            <div><strong>Assignee:</strong> ${t.assignedTo ? escapeHtml(t.assignedTo.name) : 'Unassigned'}</div>
            <div><strong>Due:</strong> ${formatDate(t.dueDate)}</div>
            <div><strong>Project:</strong> ${t.project ? escapeHtml(t.project.name) : '—'}</div>
            <div><strong>Created:</strong> ${formatDateTime(t.createdAt)}</div>
          </div>
        `;
        showModal('detailModal');
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function loadProjects() {
      try {
        const result = await api.getProjects({ limit: 100 });
        const select = document.getElementById('taskProject');
        (result.data || []).forEach(p => {
          select.innerHTML += `<option value="${p._id}">${escapeHtml(p.name)}</option>`;
        });
      } catch { /* ignore */ }
    }

    function openCreateModal() {
      document.getElementById('taskForm').reset();
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('taskDueDate').value = today;
      showModal('taskModal');
    }

    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = {
          title: document.getElementById('taskTitle').value.trim(),
          description: document.getElementById('taskDescription').value.trim(),
          dueDate: document.getElementById('taskDueDate').value,
          priority: document.getElementById('taskPriority').value,
          project: document.getElementById('taskProject').value || null,
        };
        await api.createTask(data);
        showToast('Task created', 'success');
        hideModal('taskModal');
        loadCalendar();
      } catch (err) { showToast(err.message, 'error'); }
    });

    // Real-time update on new tasks
    const s = getSocket();
    if (s) {
      s.on('notification', (data) => {
        if (data && data.message) {
          loadCalendar(); // Refresh calendar on changes
        }
      });
    }

    loadProjects().then(() => loadCalendar());
  </script>
</body>
</html>
