<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board - TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="flex-between mb-20">
          <div class="filter-bar" style="margin-bottom:0">
            <select class="form-control" id="projectFilter" onchange="loadKanban()">
              <option value="">All Projects</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Task</button>
        </div>

        <div class="kanban-board" id="kanbanBoard">
          <div class="loading-overlay" style="width:100%"><span class="loading-spinner"></span> Loading board...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="taskModalTitle">New Task</h3>
        <button class="modal-close" onclick="hideModal('taskModal')">&times;</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="editTaskId" value="">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="taskTitle" class="form-control" placeholder="Task title" required minlength="2">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="taskDescription" class="form-control" placeholder="Description" rows="2"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select id="taskStatus" class="form-control">
              <option value="TODO">TODO</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="REVIEW">Review</option>
              <option value="COMPLETED">Completed</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select id="taskPriority" class="form-control">
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
              <option value="HIGH">High</option>
              <option value="URGENT">Urgent</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Due Date</label>
            <input type="date" id="taskDueDate" class="form-control">
          </div>
          <div class="form-group">
            <label>Project</label>
            <select id="taskProject" class="form-control"><option value="">No Project</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>⏰ Reminder</label>
            <input type="datetime-local" id="taskReminderAt" class="form-control">
          </div>
          <div class="form-group">
            <label>Labels (comma-separated)</label>
            <input type="text" id="taskLabels" class="form-control" placeholder="e.g. bug, frontend">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="hideModal('taskModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="taskSubmitBtn">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal" style="max-width:650px">
      <div class="modal-header">
        <h3 class="modal-title" id="detailTitle">Task Details</h3>
        <button class="modal-close" onclick="hideModal('detailModal')">&times;</button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');
    initTheme();
    initSocket();
    document.getElementById('sidebar').innerHTML = renderSidebar('kanban');
    document.getElementById('topbar').innerHTML = renderTopbar('kanban');
    ensureSidebarOverlay();
    updateNotifCount();

    let boardData = {};
    let draggedTaskId = null;

    async function loadProjects() {
      try {
        const result = await api.getProjects({ limit: 100 });
        const select = document.getElementById('projectFilter');
        (result.data || []).forEach(p => {
          select.innerHTML += `<option value="${p._id}">${escapeHtml(p.name)}</option>`;
        });
        const projSelect = document.getElementById('taskProject');
        (result.data || []).forEach(p => {
          projSelect.innerHTML += `<option value="${p._id}">${escapeHtml(p.name)}</option>`;
        });
      } catch { /* ignore */ }
    }

    async function loadKanban() {
      const board = document.getElementById('kanbanBoard');
      board.innerHTML = '<div class="loading-overlay" style="width:100%"><span class="loading-spinner"></span> Loading...</div>';

      try {
        const params = {};
        const proj = document.getElementById('projectFilter').value;
        if (proj) params.project = proj;

        boardData = await api.getKanbanBoard(params);
        renderBoard();
      } catch (err) {
        board.innerHTML = `<div class="empty-state" style="width:100%"><h3>Error</h3><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    function renderBoard() {
      const columns = [
        { key: 'TODO', label: '📋 TODO', color: '#3b82f6' },
        { key: 'IN_PROGRESS', label: '🔄 In Progress', color: '#f59e0b' },
        { key: 'REVIEW', label: '👁️ Review', color: '#8b5cf6' },
        { key: 'COMPLETED', label: '✅ Done', color: '#22c55e' },
      ];

      const board = document.getElementById('kanbanBoard');
      board.innerHTML = columns.map(col => {
        const tasks = boardData[col.key] || [];
        return `
          <div class="kanban-column" data-status="${col.key}">
            <div class="kanban-column-header">
              <span>${col.label}</span>
              <span class="kanban-column-count">${tasks.length}</span>
            </div>
            <div class="kanban-cards" data-status="${col.key}"
              ondragover="event.preventDefault(); this.classList.add('drag-over')"
              ondragleave="this.classList.remove('drag-over')"
              ondrop="handleDrop(event, '${col.key}')">
              ${tasks.map(t => renderKanbanCard(t)).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderKanbanCard(task) {
      const labels = (task.labels || []).map(l => `<span class="kanban-label">${escapeHtml(l)}</span>`).join(' ');
      const dueDate = task.dueDate ? formatDate(task.dueDate) : '';
      const isOverdue = task.dueDate && new Date(task.dueDate) < new Date() && task.status !== 'COMPLETED';

      return `
        <div class="kanban-card" draggable="true" data-task-id="${task._id}"
          ondragstart="handleDragStart(event, '${task._id}')"
          ondragend="handleDragEnd(event)"
          onclick="showTaskDetail('${task._id}')">
          <div class="kanban-card-title">${escapeHtml(task.title)}</div>
          <div class="kanban-card-meta">
            ${priorityBadge(task.priority)}
            ${task.assignedTo ? `<span>👤 ${escapeHtml(task.assignedTo.name)}</span>` : ''}
          </div>
          ${labels ? `<div class="kanban-card-meta mt-10">${labels}</div>` : ''}
          <div class="kanban-card-footer">
            <span style="color:${isOverdue ? 'var(--danger)' : 'var(--text-secondary)'}; font-size:0.75rem">
              ${dueDate ? (isOverdue ? '⚠️ ' : '') + dueDate : ''}
            </span>
            ${task.dependsOn && task.dependsOn.length > 0 ? `<span class="dep-badge">🔗 ${task.dependsOn.length}</span>` : ''}
          </div>
        </div>
      `;
    }

    // ── Drag & Drop ───────────────────────────────────────────────────────
    function handleDragStart(e, taskId) {
      draggedTaskId = taskId;
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', taskId);
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      document.querySelectorAll('.kanban-cards').forEach(el => el.classList.remove('drag-over'));
      draggedTaskId = null;
    }

    async function handleDrop(e, newStatus) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const taskId = e.dataTransfer.getData('text/plain') || draggedTaskId;
      if (!taskId) return;

      // Find task in board data and update locally first
      let movedTask = null;
      for (const status of Object.keys(boardData)) {
        const idx = boardData[status].findIndex(t => t._id === taskId);
        if (idx !== -1) {
          movedTask = boardData[status].splice(idx, 1)[0];
          break;
        }
      }

      if (movedTask) {
        movedTask.status = newStatus;
        if (!boardData[newStatus]) boardData[newStatus] = [];
        boardData[newStatus].push(movedTask);
        renderBoard();

        // Persist to server
        try {
          await api.reorderTasks([{ taskId, status: newStatus, position: boardData[newStatus].length - 1 }]);
          showToast(`Task moved to ${newStatus.replace('_', ' ')}`, 'success');
        } catch (err) {
          showToast(err.message, 'error');
          loadKanban(); // Reload on error
        }
      }
    }

    // ── Task Detail ──────────────────────────────────────────────────────
    async function showTaskDetail(taskId) {
      try {
        const result = await api.getTask(taskId);
        const t = result.data.task;
        const subtasks = await api.getSubtasks(taskId);

        document.getElementById('detailTitle').textContent = t.title;
        document.getElementById('detailContent').innerHTML = `
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
            ${statusBadge(t.status)} ${priorityBadge(t.priority)}
            ${(t.labels || []).map(l => `<span class="kanban-label">${escapeHtml(l)}</span>`).join('')}
          </div>
          ${t.description ? `<p style="color:var(--text-secondary);margin-bottom:16px">${escapeHtml(t.description)}</p>` : ''}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;font-size:0.85rem">
            <div><strong>Assignee:</strong> ${t.assignedTo ? escapeHtml(t.assignedTo.name) : 'Unassigned'}</div>
            <div><strong>Due:</strong> ${formatDate(t.dueDate)}</div>
            <div><strong>Project:</strong> ${t.project ? escapeHtml(t.project.name) : '—'}</div>
            <div><strong>Created:</strong> ${formatDateTime(t.createdAt)}</div>
          </div>
          ${t.dependsOn && t.dependsOn.length > 0 ? `
            <div style="margin-bottom:16px"><strong>Dependencies:</strong>
              ${t.dependsOn.map(d => `<span class="badge badge-progress" style="margin:2px">${escapeHtml(d.title)} (${d.status})</span>`).join(' ')}
            </div>
          ` : ''}
          <div style="border-top:1px solid var(--border);padding-top:12px">
            <div class="flex-between mb-10">
              <strong>Subtasks (${subtasks.completed}/${subtasks.total})</strong>
              <button class="btn btn-sm btn-outline" onclick="addSubtaskPrompt('${taskId}')">+ Add</button>
            </div>
            ${progressBar(subtasks.percentage)}
            <ul class="subtask-list mt-10">
              ${(subtasks.data || []).map(s => `
                <li class="subtask-item ${s.completed ? 'completed' : ''}">
                  <input type="checkbox" ${s.completed ? 'checked' : ''} onchange="toggleSubtask('${s._id}', this.checked, '${taskId}')">
                  <span style="flex:1">${escapeHtml(s.title)}</span>
                  <button class="btn btn-sm btn-danger" style="padding:2px 8px;min-height:24px" onclick="deleteSubtaskAction('${s._id}', '${taskId}')">✕</button>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
        showModal('detailModal');
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function addSubtaskPrompt(taskId) {
      const title = prompt('Subtask title:');
      if (!title || !title.trim()) return;
      try {
        await api.createSubtask(taskId, { title: title.trim() });
        showToast('Subtask added', 'success');
        showTaskDetail(taskId);
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function toggleSubtask(subtaskId, completed, taskId) {
      try {
        await api.updateSubtask(subtaskId, { completed });
        showTaskDetail(taskId);
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteSubtaskAction(subtaskId, taskId) {
      try {
        await api.deleteSubtask(subtaskId);
        showToast('Subtask deleted', 'success');
        showTaskDetail(taskId);
      } catch (err) { showToast(err.message, 'error'); }
    }

    // ── Create Task ─────────────────────────────────────────────────────
    function openCreateModal() {
      document.getElementById('taskModalTitle').textContent = 'New Task';
      document.getElementById('taskSubmitBtn').textContent = 'Create Task';
      document.getElementById('editTaskId').value = '';
      document.getElementById('taskForm').reset();
      showModal('taskModal');
    }

    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('taskSubmitBtn');
      btn.disabled = true;
      try {
        const data = {
          title: document.getElementById('taskTitle').value.trim(),
          description: document.getElementById('taskDescription').value.trim(),
          status: document.getElementById('taskStatus').value,
          priority: document.getElementById('taskPriority').value,
          dueDate: document.getElementById('taskDueDate').value || null,
          project: document.getElementById('taskProject').value || null,
          reminderAt: document.getElementById('taskReminderAt').value || null,
          labels: document.getElementById('taskLabels').value.split(',').map(l => l.trim()).filter(Boolean),
        };
        await api.createTask(data);
        showToast('Task created', 'success');
        hideModal('taskModal');
        loadKanban();
      } catch (err) { showToast(err.message, 'error'); }
      finally { btn.disabled = false; }
    });

    // Init
    loadProjects().then(() => loadKanban());
  </script>
</body>
</html>
