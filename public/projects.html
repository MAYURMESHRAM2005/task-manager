<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - TaskFlow</title>
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskFlow">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="flex-between mb-20">
          <h2 style="font-size:1rem;color:var(--text-secondary)" id="projectCount"></h2>
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Project</button>
        </div>
        <div id="projectGrid" class="stats-grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
          <div class="loading-overlay" style="grid-column:1/-1"><span class="loading-spinner"></span></div>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>

  <!-- Create/Edit Project Modal -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="projectModalTitle">New Project</h3>
        <button class="modal-close" onclick="hideModal('projectModal')">&times;</button>
      </div>
      <form id="projectForm">
        <input type="hidden" id="editProjectId" value="">
        <div class="form-group">
          <label>Project Name *</label>
          <input type="text" id="projectName" class="form-control" placeholder="Project name" required minlength="2">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="projectDesc" class="form-control" placeholder="Project description" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="projectStatus" class="form-control">
            <option value="PLANNED">Planned</option>
            <option value="ACTIVE">Active</option>
            <option value="COMPLETED">Completed</option>
            <option value="ARCHIVED">Archived</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="hideModal('projectModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="projectSubmitBtn">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Delete Project</h3>
        <button class="modal-close" onclick="hideModal('deleteModal')">&times;</button>
      </div>
      <p>Are you sure you want to delete this project? Tasks will be unassigned but not deleted.</p>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="hideModal('deleteModal')">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    if (!requireAuth()) throw new Error('Not authenticated');
    initTheme();
    document.getElementById('sidebar').innerHTML = renderSidebar('projects');
    document.getElementById('topbar').innerHTML = renderTopbar('projects');
    ensureSidebarOverlay();
    updateNotifCount();

    let currentPage = 1;

    async function loadProjects(page = 1) {
      currentPage = page;
      const grid = document.getElementById('projectGrid');
      grid.innerHTML = '<div class="loading-overlay" style="grid-column:1/-1"><span class="loading-spinner"></span></div>';

      try {
        const result = await api.getProjects({ page, limit: 12 });
        const projects = result.data;
        const pag = result.pagination;
        document.getElementById('projectCount').textContent = `${pag.total} project${pag.total !== 1 ? 's' : ''}`;

        if (projects.length === 0) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📁</div><h3>No projects yet</h3><p>Create your first project</p></div>';
        } else {
          grid.innerHTML = projects.map(p => `
            <div class="card" style="cursor:pointer" onclick="viewProject('${p._id}')">
              <div class="flex-between mb-10">
                <span class="badge badge-${p.status === 'ACTIVE' ? 'progress' : p.status === 'COMPLETED' ? 'completed' : 'todo'}">${p.status}</span>
                <div class="flex gap-10">
                  <button class="btn btn-sm btn-outline" onclick="event.stopPropagation();openEditModal('${p._id}')">Edit</button>
                  <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();openDeleteModal('${p._id}')">Del</button>
                </div>
              </div>
              <h3 style="margin-bottom:6px">${escapeHtml(p.name)}</h3>
              <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px">${escapeHtml(p.description || 'No description')}</p>
              <div style="background:var(--border);height:6px;border-radius:3px;overflow:hidden">
                <div style="width:${p.taskStats?.completionPercentage || 0}%;height:100%;background:var(--primary);border-radius:3px"></div>
              </div>
              <div style="font-size:0.78rem;color:var(--text-secondary);margin-top:6px">
                ${p.taskStats?.completed || 0}/${p.taskStats?.total || 0} tasks completed · ${(p.taskStats?.completionPercentage || 0)}%
              </div>
            </div>
          `).join('');
        }

        // Pagination
        const container = document.getElementById('pagination');
        if (pag.totalPages <= 1) { container.innerHTML = ''; return; }
        let html = `<button ${pag.page<=1?'disabled':''} onclick="loadProjects(${pag.page-1})">‹ Prev</button>`;
        for (let i=1; i<=pag.totalPages; i++) { html += `<button class="${i===pag.page?'active':''}" onclick="loadProjects(${i})">${i}</button>`; }
        html += `<button ${pag.page>=pag.totalPages?'disabled':''} onclick="loadProjects(${pag.page+1})">Next ›</button>`;
        container.innerHTML = html;
      } catch (err) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><h3>Error</h3><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    function openCreateModal() {
      document.getElementById('projectModalTitle').textContent = 'New Project';
      document.getElementById('projectSubmitBtn').textContent = 'Create Project';
      document.getElementById('editProjectId').value = '';
      document.getElementById('projectForm').reset();
      showModal('projectModal');
    }

    async function openEditModal(id) {
      try {
        const result = await api.getProject(id);
        const p = result.data.project;
        document.getElementById('projectModalTitle').textContent = 'Edit Project';
        document.getElementById('projectSubmitBtn').textContent = 'Update Project';
        document.getElementById('editProjectId').value = p._id;
        document.getElementById('projectName').value = p.name;
        document.getElementById('projectDesc').value = p.description || '';
        document.getElementById('projectStatus').value = p.status;
        showModal('projectModal');
      } catch (err) { showToast(err.message, 'error'); }
    }

    function viewProject(id) {
      showToast('Project detail view coming soon', 'info');
    }

    document.getElementById('projectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('projectSubmitBtn');
      const editId = document.getElementById('editProjectId').value;
      btn.disabled = true;

      try {
        const data = { name: document.getElementById('projectName').value.trim(), description: document.getElementById('projectDesc').value.trim(), status: document.getElementById('projectStatus').value };
        if (editId) { await api.updateProject(editId, data); showToast('Project updated', 'success'); }
        else { await api.createProject(data); showToast('Project created', 'success'); }
        hideModal('projectModal');
        loadProjects(currentPage);
      } catch (err) { showToast(err.message, 'error'); }
      finally { btn.disabled = false; }
    });

    // ── Delete ──────────────────────────────────────────────────────────
    let deleteProjectId;
    function openDeleteModal(id) { deleteProjectId = id; showModal('deleteModal'); }
    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      try {
        await api.deleteProject(deleteProjectId);
        showToast('Project deleted successfully', 'success');
        hideModal('deleteModal');
        loadProjects(currentPage);
      } catch (err) { showToast(err.message, 'error'); }
    });

    loadProjects();
  </script>
</body>
</html>
