<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - TaskFlow</title>
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskFlow">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <!-- Productivity Score -->
        <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
          <div class="stat-card" style="display:flex;align-items:center;gap:16px">
            <div id="scoreRing"></div>
            <div>
              <div class="stat-label">Productivity Score</div>
              <div style="font-size:0.78rem;color:var(--text-secondary)">Based on completion rate</div>
            </div>
          </div>
          <div class="stat-card"><div class="stat-icon blue">📋</div><div class="stat-value" id="totalTasks">0</div><div class="stat-label">Total Tasks</div></div>
          <div class="stat-card"><div class="stat-icon green">✅</div><div class="stat-value" id="completedTasks">0</div><div class="stat-label">Completed</div></div>
          <div class="stat-card"><div class="stat-icon yellow">⏳</div><div class="stat-value" id="pendingTasks">0</div><div class="stat-label">Pending</div></div>
          <div class="stat-card"><div class="stat-icon red">⚠️</div><div class="stat-value" id="overdueTasks">0</div><div class="stat-label">Overdue</div></div>
          <div class="stat-card"><div class="stat-icon purple">📅</div><div class="stat-value" id="todayTasks">0</div><div class="stat-label">Due Today</div></div>
        </div>

        <!-- Charts -->
        <div class="analytics-grid">
          <div class="chart-container">
            <h3>Tasks by Status</h3>
            <canvas id="statusChart"></canvas>
          </div>
          <div class="chart-container">
            <h3>Tasks by Priority</h3>
            <canvas id="priorityChart"></canvas>
          </div>
          <div class="chart-container">
            <h3>Weekly Completions</h3>
            <canvas id="weeklyChart"></canvas>
          </div>
          <div class="chart-container">
            <h3>Completion Trend (30 days)</h3>
            <canvas id="monthlyChart"></canvas>
          </div>
        </div>

        <!-- Upcoming Tasks -->
        <div class="card mt-20">
          <h3 style="font-size:1rem;margin-bottom:12px">📅 Upcoming Tasks (This Week)</h3>
          <div id="upcomingList"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    if (!requireAuth()) throw new Error('Not authenticated');
    initTheme();
    document.getElementById('sidebar').innerHTML = renderSidebar('analytics');
    document.getElementById('topbar').innerHTML = renderTopbar('analytics');
    ensureSidebarOverlay();
    updateNotifCount();

    async function loadAnalytics() {
      try {
        const result = await api.getDashboardStats();
        const s = result.data.stats;

        // Stats
        document.getElementById('totalTasks').textContent = s.totalTasks;
        document.getElementById('completedTasks').textContent = s.completedTasks;
        document.getElementById('pendingTasks').textContent = s.pendingTasks;
        document.getElementById('overdueTasks').textContent = s.overdueTasks;
        document.getElementById('todayTasks').textContent = s.todayTasks;
        document.getElementById('scoreRing').innerHTML = scoreRing(s.productivityScore);

        let analyticsStats = s;
        let aStatusChart, aPriorityChart, aWeeklyChart, aMonthlyChart;

        function destroyAnalyticsCharts() {
          [aStatusChart, aPriorityChart, aWeeklyChart, aMonthlyChart].forEach(c => { if (c) c.destroy(); });
          aStatusChart = aPriorityChart = aWeeklyChart = aMonthlyChart = null;
        }

        function renderAnalyticsCharts(s) {
          if (typeof Chart === 'undefined') {
            document.querySelectorAll('.chart-container').forEach(el => {
              if (!el.querySelector('.chart-fallback')) {
                const fb = document.createElement('div');
                fb.className = 'chart-fallback';
                fb.style.cssText = 'display:flex;align-items:center;justify-content:center;height:180px;color:var(--text-secondary);font-size:0.85rem';
                fb.textContent = '📊 Charts unavailable (Chart.js failed to load)';
                const canvas = el.querySelector('canvas');
                if (canvas) canvas.style.display = 'none';
                el.appendChild(fb);
              }
            });
            return;
          }
          destroyAnalyticsCharts();
          const t = getChartTheme();
          const scales = getChartScales(t);

          // Status Chart
          aStatusChart = new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
              labels: ['TODO', 'In Progress', 'Review', 'Completed', 'Cancelled'],
              datasets: [{ data: [s.statusBreakdown.TODO || 0, s.statusBreakdown.IN_PROGRESS || 0, s.statusBreakdown.REVIEW || 0, s.statusBreakdown.COMPLETED || 0, s.statusBreakdown.CANCELLED || 0], backgroundColor: ['#3b82f6', '#f59e0b', '#8b5cf6', '#22c55e', '#ef4444'] }],
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: t.legendColor, usePointStyle: true, padding: 16 } }, tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipTitle, bodyColor: t.tooltipBody, borderColor: t.tooltipBorder, borderWidth: 1 } } },
          });

          // Priority Chart
          aPriorityChart = new Chart(document.getElementById('priorityChart'), {
            type: 'bar',
            data: {
              labels: ['Low', 'Medium', 'High', 'Urgent'],
              datasets: [{ label: 'Tasks', data: [s.priorityBreakdown.LOW || 0, s.priorityBreakdown.MEDIUM || 0, s.priorityBreakdown.HIGH || 0, s.priorityBreakdown.URGENT || 0], backgroundColor: ['#22c55e', '#f59e0b', '#f97316', '#ef4444'] }],
            },
            options: { responsive: true, plugins: { legend: { display: false }, tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipTitle, bodyColor: t.tooltipBody, borderColor: t.tooltipBorder, borderWidth: 1 } }, scales: scales },
          });

          // Weekly Chart
          const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
          const weeklyData = new Array(7).fill(0);
          s.weeklyCompleted.forEach((w) => { weeklyData[w._id - 1] = w.count; });
          aWeeklyChart = new Chart(document.getElementById('weeklyChart'), {
            type: 'line',
            data: {
              labels: dayLabels,
              datasets: [{ label: 'Completed', data: weeklyData, borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,0.1)', fill: true, tension: 0.4, pointBackgroundColor: '#6366f1', pointBorderColor: '#6366f1' }],
            },
            options: { responsive: true, plugins: { legend: { display: false }, tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipTitle, bodyColor: t.tooltipBody, borderColor: t.tooltipBorder, borderWidth: 1 } }, scales: scales },
          });

          // Monthly Chart
          const monthlyData = new Array(30).fill(0);
          s.monthlyCompleted.forEach((m) => { monthlyData[m._id - 1] = m.count; });
          aMonthlyChart = new Chart(document.getElementById('monthlyChart'), {
            type: 'bar',
            data: {
              labels: Array.from({ length: 30 }, (_, i) => i + 1),
              datasets: [{ label: 'Completed', data: monthlyData, backgroundColor: '#6366f1' }],
            },
            options: { responsive: true, plugins: { legend: { display: false }, tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipTitle, bodyColor: t.tooltipBody, borderColor: t.tooltipBorder, borderWidth: 1 } }, scales: { x: { ticks: { color: t.textColor, maxTicksLimit: 10 }, grid: { color: t.gridColor }, border: { color: t.borderColor } }, y: { ticks: { color: t.textColor, stepSize: 1 }, grid: { color: t.gridColor }, border: { color: t.borderColor } } } },
          });
        }

        renderAnalyticsCharts(s);

        // Re-render charts on theme switch
        window.addEventListener('themechange', () => {
          if (analyticsStats) renderAnalyticsCharts(analyticsStats);
        });

        // Upcoming tasks
        if (s.upcomingTasks > 0) {
          const tasksResult = await api.getTasks({ sortBy: 'dueDate', sortOrder: 'asc', limit: 10 });
          const upcoming = (tasksResult.data || []).filter(t => t.status !== 'COMPLETED' && t.status !== 'CANCELLED');
          document.getElementById('upcomingList').innerHTML = upcoming.length > 0
            ? upcoming.map(t => `
              <div class="activity-item">
                <div class="activity-dot" style="background:${t.priority === 'URGENT' ? 'var(--danger)' : t.priority === 'HIGH' ? 'var(--warning)' : 'var(--info)'}"></div>
                <div style="flex:1">
                  <div style="font-weight:500">${escapeHtml(t.title)}</div>
                  <div style="font-size:0.78rem;color:var(--text-secondary)">${formatDate(t.dueDate)} · ${t.assignedTo ? escapeHtml(t.assignedTo.name) : 'Unassigned'}</div>
                </div>
                ${statusBadge(t.status)} ${priorityBadge(t.priority)}
              </div>
            `).join('')
            : '<div class="empty-state" style="padding:20px"><p>No upcoming tasks</p></div>';
        } else {
          document.getElementById('upcomingList').innerHTML = '<div class="empty-state" style="padding:20px"><p>No upcoming tasks</p></div>';
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    loadAnalytics();
  </script>
</body>
</html>
