<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="card" style="max-width:600px">
          <div class="flex gap-10 mb-20" style="align-items:center">
            <div class="avatar avatar-lg" id="profileAvatar" style="font-size:1.5rem">U</div>
            <div>
              <h2 id="profileName" style="font-size:1.2rem">Loading...</h2>
              <p style="color:var(--text-secondary);font-size:0.88rem" id="profileEmail"></p>
            </div>
          </div>

          <h3 style="margin-bottom:15px;font-size:0.95rem">Edit Profile</h3>
          <form id="profileForm">
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="profileNameInput" class="form-control" required minlength="2">
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>

        <div class="card mt-20" style="max-width:600px">
          <h3 style="margin-bottom:15px;font-size:0.95rem">Change Password</h3>
          <form id="passwordForm">
            <div class="form-group">
              <label>Current Password</label>
              <input type="password" id="currentPassword" class="form-control" required>
            </div>
            <div class="form-group">
              <label>New Password</label>
              <input type="password" id="newPassword" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');
    initTheme();
    document.getElementById('sidebar').innerHTML = renderSidebar('profile');
    document.getElementById('topbar').innerHTML = renderTopbar('profile');
    ensureSidebarOverlay();
    updateNotifCount();

    async function loadProfile() {
      try {
        const result = await api.getProfile();
        const user = result.data.user;
        document.getElementById('profileAvatar').textContent = user.name.charAt(0);
        document.getElementById('profileName').textContent = user.name;
        document.getElementById('profileEmail').textContent = user.email;
        document.getElementById('profileNameInput').value = user.name;
      } catch (err) { showToast(err.message, 'error'); }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const result = await api.updateProfile({ name: document.getElementById('profileNameInput').value.trim() });
        api.setUser(result.data.user);
        showToast('Profile updated', 'success');
        loadProfile();
      } catch (err) { showToast(err.message, 'error'); }
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api.changePassword({
          currentPassword: document.getElementById('currentPassword').value,
          newPassword: document.getElementById('newPassword').value,
        });
        showToast('Password changed. Please log in again.', 'success');
        setTimeout(() => { api.clearTokens(); window.location.href = '/login'; }, 2000);
      } catch (err) { showToast(err.message, 'error'); }
    });

    loadProfile();
  </script>
</body>
</html>
