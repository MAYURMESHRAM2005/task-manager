<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('users', this)">Users</button>
          <button class="tab-btn" onclick="switchTab('stats', this)">Statistics</button>
          <button class="tab-btn" onclick="switchTab('audit', this)">Audit Logs</button>
        </div>

        <!-- Users Tab -->
        <div id="tab-users" class="tab-content">
          <div class="card">
            <div class="table-wrapper">
              <table>
                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead>
                <tbody id="userTableBody">
                  <tr><td colspan="6" class="loading-overlay"><span class="loading-spinner"></span></td></tr>
                </tbody>
              </table>
            </div>
            <div class="pagination" id="userPagination"></div>
          </div>
        </div>

        <!-- Statistics Tab -->
        <div id="tab-stats" class="tab-content hidden">
          <div class="stats-grid" id="adminStats"></div>
        </div>

        <!-- Audit Logs Tab -->
        <div id="tab-audit" class="tab-content hidden">
          <div class="card">
            <div class="table-wrapper">
              <table>
                <thead><tr><th>User</th><th>Action</th><th>Entity</th><th>Description</th><th>Time</th></tr></thead>
                <tbody id="auditTableBody">
                  <tr><td colspan="5" class="loading-overlay"><span class="loading-spinner"></span></td></tr>
                </tbody>
              </table>
            </div>
            <div class="pagination" id="auditPagination"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');
    const user = api.getUser();
    if (user?.role !== 'ADMIN') { window.location.href = '/dashboard'; throw new Error('Admin access required'); }

    initTheme();
    document.getElementById('sidebar').innerHTML = renderSidebar('admin');
    document.getElementById('topbar').innerHTML = renderTopbar('admin');
    ensureSidebarOverlay();
    updateNotifCount();

    let usersPage = 1, auditPage = 1;

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      btn.classList.add('active');
      if (tab === 'users') loadUsers();
      else if (tab === 'stats') loadStats();
      else if (tab === 'audit') loadAuditLogs();
    }

    async function loadUsers(page = 1) {
      usersPage = page;
      const tbody = document.getElementById('userTableBody');
      try {
        const result = await api.getAdminUsers({ page, limit: 10 });
        const users = result.data;
        const pag = result.pagination;

        tbody.innerHTML = users.map(u => `
          <tr>
            <td data-label="Name"><div class="flex gap-10" style="align-items:center"><div class="avatar">${u.name.charAt(0)}</div>${escapeHtml(u.name)}</div></td>
            <td data-label="Email">${escapeHtml(u.email)}</td>
            <td data-label="Role">${roleBadge(u.role)}</td>
            <td data-label="Status"><span class="badge ${u.isActive ? 'badge-completed' : 'badge-cancelled'}">${u.isActive ? 'Active' : 'Inactive'}</span></td>
            <td data-label="Last Login">${u.lastLogin ? formatDateTime(u.lastLogin) : 'Never'}</td>
            <td data-label="Actions">
              <div class="flex gap-10">
                <select class="form-control" style="width:auto;padding:4px 8px;font-size:0.8rem" onchange="changeRole('${u._id}', this.value)">
                  <option value="USER" ${u.role==='USER'?'selected':''}>User</option>
                  <option value="MANAGER" ${u.role==='MANAGER'?'selected':''}>Manager</option>
                  <option value="ADMIN" ${u.role==='ADMIN'?'selected':''}>Admin</option>
                </select>
                <button class="btn btn-sm ${u.isActive ? 'btn-warning' : 'btn-success'}" onclick="toggleStatus('${u._id}', ${!u.isActive})">${u.isActive ? 'Deactivate' : 'Activate'}</button>
              </div>
            </td>
          </tr>
        `).join('');

        const container = document.getElementById('userPagination');
        if (pag.totalPages <= 1) { container.innerHTML = ''; return; }
        let html = `<button ${pag.page<=1?'disabled':''} onclick="loadUsers(${pag.page-1})">‹</button>`;
        for (let i=1; i<=pag.totalPages; i++) { html += `<button class="${i===pag.page?'active':''}" onclick="loadUsers(${i})">${i}</button>`; }
        html += `<button ${pag.page>=pag.totalPages?'disabled':''} onclick="loadUsers(${pag.page+1})">›</button>`;
        container.innerHTML = html;
      } catch (err) { tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><h3>Error</h3><p>${escapeHtml(err.message)}</p></div></td></tr>`; }
    }

    async function changeRole(id, role) {
      try { await api.updateUserRole(id, role); showToast('Role updated', 'success'); loadUsers(usersPage); }
      catch (err) { showToast(err.message, 'error'); }
    }

    async function toggleStatus(id, isActive) {
      try { await api.updateUserStatus(id, isActive); showToast('Status updated', 'success'); loadUsers(usersPage); }
      catch (err) { showToast(err.message, 'error'); }
    }

    async function loadStats() {
      try {
        const result = await api.getStatistics();
        const s = result.data;
        document.getElementById('adminStats').innerHTML = `
          <div class="stat-card"><div class="stat-icon blue">👤</div><div class="stat-value">${s.totalUsers}</div><div class="stat-label">Total Users</div></div>
          <div class="stat-card"><div class="stat-icon green">✅</div><div class="stat-value">${s.activeUsers}</div><div class="stat-label">Active Users</div></div>
          <div class="stat-card"><div class="stat-icon purple">📋</div><div class="stat-value">${s.totalTasks}</div><div class="stat-label">Total Tasks</div></div>
          <div class="stat-card"><div class="stat-icon yellow">📁</div><div class="stat-value">${s.totalProjects}</div><div class="stat-label">Total Projects</div></div>
          <div class="stat-card"><div class="stat-icon red">👥</div><div class="stat-value">${s.totalTeams}</div><div class="stat-label">Total Teams</div></div>
        `;
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function loadAuditLogs(page = 1) {
      auditPage = page;
      const tbody = document.getElementById('auditTableBody');
      try {
        const result = await api.getAuditLogs({ page, limit: 15 });
        const logs = result.data;
        const pag = result.pagination;

        tbody.innerHTML = logs.map(l => `
          <tr>
            <td data-label="User">${l.user ? escapeHtml(l.user.name) : 'System'}</td>
            <td data-label="Action"><span class="badge badge-todo">${l.action}</span></td>
            <td data-label="Entity">${l.entity}</td>
            <td data-label="Description">${escapeHtml(l.description || '')}</td>
            <td data-label="Time">${formatDateTime(l.createdAt)}</td>
          </tr>
        `).join('');

        const container = document.getElementById('auditPagination');
        if (pag.totalPages <= 1) { container.innerHTML = ''; return; }
        let html = `<button ${pag.page<=1?'disabled':''} onclick="loadAuditLogs(${pag.page-1})">‹</button>`;
        for (let i=1; i<=pag.totalPages; i++) { html += `<button class="${i===pag.page?'active':''}" onclick="loadAuditLogs(${i})">${i}</button>`; }
        html += `<button ${pag.page>=pag.totalPages?'disabled':''} onclick="loadAuditLogs(${pag.page+1})">›</button>`;
        container.innerHTML = html;
      } catch (err) { tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><h3>Error</h3><p>${escapeHtml(err.message)}</p></div></td></tr>`; }
    }

    loadUsers();
  </script>
</body>
</html>
