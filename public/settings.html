<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - TaskFlow</title>
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskFlow">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <div class="page-content">
        <div class="card" style="max-width:600px">
          <h3 style="margin-bottom:20px">Application Settings</h3>

          <div class="form-group">
            <label>Theme</label>
            <div class="flex gap-10">
              <button class="btn btn-outline" onclick="setTheme('light')">☀️ Light</button>
              <button class="btn btn-outline" onclick="setTheme('dark')">🌙 Dark</button>
              <button class="btn btn-outline" onclick="setTheme('')">System</button>
            </div>
          </div>

          <div style="border-top:1px solid var(--border);padding-top:15px;margin-top:15px">
            <h4 style="margin-bottom:10px">Account</h4>
            <button class="btn btn-danger" onclick="handleDeleteAccount()">Deactivate Account</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    if (!requireAuth()) throw new Error('Not authenticated');
    initTheme();
    document.getElementById('sidebar').innerHTML = renderSidebar('settings');
    document.getElementById('topbar').innerHTML = renderTopbar('settings');
    ensureSidebarOverlay();

    function setTheme(theme) {
      if (theme) { document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('taskflow_theme', theme); }
      else { document.documentElement.removeAttribute('data-theme'); localStorage.removeItem('taskflow_theme'); }
      showToast('Theme updated', 'success');
    }

    function handleDeleteAccount() {
      showToast('Account deactivation is managed by administrators.', 'info');
    }
  </script>
</body>
</html>
