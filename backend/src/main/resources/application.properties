# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
app.env=${APP_ENV:development}

# ─── MySQL ───────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskflow}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:dev-jwt-secret-change-in-production-make-it-long-and-random}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:dev-refresh-secret-change-in-production-make-it-long-and-random}
app.jwt.expiration=${JWT_EXPIRES_IN:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRES_IN:604800000}

# ─── CORS (comma separated list of allowed frontend origins) ─────────────────
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173,http://localhost:3000,http://localhost}

# ─── File uploads ────────────────────────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Seed (opt-in demo data, disabled by default) ────────────────────────────
app.seed.enabled=${APP_SEED_ENABLED:false}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=warn
