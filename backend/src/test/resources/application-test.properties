# Integration-test profile: in-memory H2 in MySQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:taskflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
# Quote identifiers so reserved words (e.g. POSITION) work on H2 as they do on MySQL.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

app.jwt.secret=test-jwt-secret-key-for-integration-tests-only-0123456789
app.jwt.refresh-secret=test-refresh-secret-key-for-integration-tests-only-0123456789
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000
app.cors.allowed-origins=http://localhost:5173
app.upload.dir=target/test-uploads
app.seed.enabled=false
